name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The browser suite drives the real bundle over CDP. The runner image
      # ships Google Chrome; fall back to any chromium on PATH.
      - name: Find a browser
        run: |
          for c in google-chrome chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "CHROME=$c" >> "$GITHUB_ENV"
              echo "using $c ($("$c" --version))"
              exit 0
            fi
          done
          echo "::error::no Chrome or Chromium on PATH"
          exit 1

      - run: npm test

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Pack and check the tarball
        run: |
          npm pack --dry-run --json > pack.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const p = JSON.parse(readFileSync("pack.json", "utf8"))[0];
            const names = p.files.map((f) => f.path);
            const required = [
              "bin/bcc.mjs", "dist/bcc.js", "dist/index.html",
              "hub/server.mjs", "scripts/copy.mjs", "scripts/doctor.mjs",
              "scripts/pack.mjs", "src/app/main.js", "src/tools/index.js",
              "README.md", "LICENSE", "package.json",
            ];
            const missing = required.filter((f) => !names.includes(f));
            if (missing.length) { console.error("missing from tarball:", missing); process.exit(1); }
            const leaked = names.filter((n) => n.startsWith("test/") || n.startsWith("docs/") || n.startsWith(".github/"));
            if (leaked.length) { console.error("should not be published:", leaked); process.exit(1); }
            const mb = p.size / 1024 / 1024;
            if (mb > 1) { console.error(`tarball is ${mb.toFixed(2)} MB, over the 1 MB ceiling`); process.exit(1); }
            console.log(`tarball ok: ${p.entryCount} files, ${(p.size / 1024).toFixed(0)} kB`);
          '

      - name: Install the tarball and run the CLI from a foreign cwd
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/browser-command-center-*.tgz
          ./node_modules/.bin/bcc --version
          ./node_modules/.bin/bcc path
          ./node_modules/.bin/bcc doctor
