<!doctype html><meta charset="utf-8"><title>fixture</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: Inter, sans-serif; }
  .card { display:flex; flex-direction:column; gap:12px; padding:16px 20px;
          width:320px; background:#ffffff; border:1px solid #e2e5ea;
          border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .card__title { font-size:18px; font-weight:600; line-height:24px; color:#111827; margin:0; }
  .card__body { font-size:14px; line-height:20px; color:#4b5563; margin:0; }
  .btn { font-size:14px; font-weight:600; padding:8px 16px; border-radius:6px;
         background:#3b6fe0; color:#fff; border:none; text-transform:uppercase;
         letter-spacing:0.5px; }
  .hidden { display:none; }
</style>
<div class="card" id="card">
  <h2 class="card__title">Filter results</h2>
  <p class="card__body">Narrow the list by category.</p>
  <button class="btn">Apply</button>
  <span class="hidden">should not be captured</span>
</div>
